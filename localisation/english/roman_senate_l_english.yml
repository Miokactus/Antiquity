 ## ROMAN EMPIRE EVENTS ##
 roman_senate.1.t: "Senate: Order of the Day"
 roman_senate.1.d: "The Senate has now been united, as per the wish of the Emperor, and is awaiting the order of the day that will be discussed inside of the Curia. The 600 Senators, unable to be housed or united together at one time, have sent 200 of them to decide and debate."
 roman_senate.1.a: "Let's push for military investments"
 roman_senate.1.b: "Convince them to build more civilian equipments"
 roman_senate.1.c: "Why not funding smaller cities?"

 roman_senate.2.t: "The Senate comes to a Conclusion"
 roman_senate.2.d: "The current session of the Senate has come to a verdict; the bill proposed by the Emperor has been accepted, and the senatus-consulta will now be passed down to the comitias, hoping that it will be accepted there too."
 roman_senate.2.a: "A victory for our military!"
 roman_senate.2.b: "Our citizens will be loyal!"
 roman_senate.2.c: "Cities should look more like Rome!"

 roman_senate.3.t: "Verdict of the Comitias: Military Bill"
 roman_senate.3.d: "The voting process of the comitias has come to a conclusion, with all comitias returning back their decision. The senatus-consulta sent by the Senate will not be law until we count the votes and these represent more than 50% of the comitia's voters."
 roman_senate.3.a: "Glory! The People of Rome are ready for War!"
 roman_senate.3.b: "A blow to the established order"

 roman_senate.4.t: "Verdict of the Comitias: Civilian Bill"
 roman_senate.4.d: "The voting process of the comitias has come to a conclusion, with all comitias returning back their decision. The senatus-consulta sent by the Senate will not be law until we count the votes and these represent more than 50% of the comitia's voters."
 roman_senate.4.a: "The civilians will be thankful"
 roman_senate.4.b: "A blow to the established order"

 roman_senate.5.t: "Verdict of the Comitias: Funding Cities"
 roman_senate.5.d: "The voting process of the comitias has come to a conclusion, with all comitias returning back their decision. The senatus-consulta sent by the Senate will not be law until we count the votes and these represent more than 50% of the comitia's voters."
 roman_senate.5.a: "Citizens, arise!"
 roman_senate.5.b: "A blow to the established order"

 roman_senate.6.t: "The Senate dismiss the Bill!"
 roman_senate.6.d: "Desastrous! The Senators, while not even finishing to examine the newest bill we proposed, have dismissed it! Citing recurrent imperial interferences within the Senate's affairs, the Senators seems to want to teach the Chancellery a lesson. In the current swing, a bunch of Senators then declared their support to the dismissing of the bill, damaging even more the Senate's loyalty to us."
 roman_senate.6.a: "These damned Senators!"
