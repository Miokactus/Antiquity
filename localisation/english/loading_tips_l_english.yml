l_english:
 LOADING_TIP_0: "Veni, vidi, vici.\n- Julius Caesar, after the Battle of Zela in 58 B.C."
 LOADING_TIP_1: "The soldier's duty is to obey.\n- Pompey, roman general of the Late Republic"
 LOADING_TIP_2: "It is better to be feared than loved, if you cannot be both.\n- Marcus Licinius Crassus"
 LOADING_TIP_3: "The best way to win a battle is to avoid it.\n- Gnaeus Julius Agricola"
 LOADING_TIP_4: "Let the people be fed.\n- Pompey"
 LOADING_TIP_5: "The law is the master of the soldier.\n- Lucius Cornelius Sulla"
 LOADING_TIP_6: "A general must be a chameleon.\n- Titus Labienus"
 LOADING_TIP_7: "War, as the saying goes, is full of false alarms.\n- Aristotle"
 LOADING_TIP_8: "Silent enim leges inter arma.\n- Cicero"
 LOADING_TIP_9: "Alea iacta est.\n- Julius Caesar, about to cross the Rubicon"
 LOADING_TIP_10: "In peace, sons bury their fathers; in war, fathers bury their sons.\n- Herodotus"
 LOADING_TIP_11: "To a good general luck is important.\n- Livy"
 LOADING_TIP_12: "Fas est et ab hoste doceri.\n- Ovid"
 LOADING_TIP_13: "I am more afraid of our own mistakes than of our enemies' designs.\n- Pericles"
 LOADING_TIP_14: "Appear weak when you are strong, and strong when you are weak.\n- Sun Tzu, The Art of War"
 LOADING_TIP_15: "The greatest victory is that which requires no battle.\n- Sun Tzu, The Art of War"
 LOADING_TIP_16: "There is no instance of a nation benefitting from prolonged warfare.\n- Sun Tzu, The Art of War"
 LOADING_TIP_17: "He who is prudent and lies in wait for an enemy who is not, will be victorious.\n- Sun Tzu, The Art of War"