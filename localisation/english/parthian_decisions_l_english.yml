 ## EVENTS
 arsacid_event.1.t: "Call to War!"
 arsacid_event.1.a: "We shall defend our brothers!"
 arsacid_event.1.b: "Nope!"

 arsacid_event.2.t: "Call to War!"
 arsacid_event.2.a: "A good ally!"

 arsacid_event.3.t: "Call to War!"
 arsacid_event.3.a: "Okay."
 arsacid_event.3.b: "Ahaha.. I've only asked out of politeness."

 arsacid_event.4.t: "Request for Manpower"
 arsacid_event.4.a: "We can spare some."
 arsacid_event.4.b: "No, sorry."

 arsacid_event.5.t: "Rebellion!"
 arsacid_event.5.a: "Mobilise the armies!"
 arsacid_event.5.b: "Let's go for a.. diplomatic approach."

 arsacid_event.6.t: "Rebellion! (Diplomatic Way)"
 arsacid_event.6.a: "Ask for more freedom!"
 arsacid_event.6.b: "Ask for gifts and guarantees!"
 arsacid_event.6.c: "All for one!"

 arsacid_event.7.t: "Rebellion (Diplomatic Way)"
 arsacid_event.7.a: "Grant them more freedom but nothing more."
 arsacid_event.7.b: "Grant them gifts and guarantees but nothing more."
 arsacid_event.7.c: "Concede everything!"
 arsacid_event.7.d: "You're not the King of Kings here!"

 arsacid_event.8.t: "Start of the Rebellion!"
 arsacid_event.8.a: "Onwards!"

 arsacid_event.9.t: "Integration of §Y[FROM.GetName]§!"
 arsacid_event.9.d: "After an incredible amount of time, we have finally pacified the region and we'll be able to integrate it as soon as possible! The local populace are more than happy to join us. In addition, our authority will be reinforced in the region and nation-wide, so that maybe we'll be able to integrate more and more satraps and put an end to this era of separation!"
 arsacid_event.9.a: "Welcome!"

 arsacid_event.10.t: "Independence of the Eastern Satrapy!"
 arsacid_event.10.d: "The eastern satrapy has declared its independence from our rule!"
 arsacid_event.10.a: "There's nothing we can do about it."
 arsacid_event.10.b: "This means war!"

 arsacid_event.11.t: "Appeasement with Rome"
 arsacid_event.11.d: "An envoy from the Arsacid 'Empire' has arrived in Rome. They are asking for a treaty of friendship between our two countries, hoping that it could end the everlasting wars between us."
 arsacid_event.11.a: "Alright, for now."
 arsacid_event.11.b: "No."

 arsacid_event.12.t: "Skirmishes at the Border!"
 arsacid_event.12.d: "Reports coming from the east are bringing bad news: the Arsacid armies have begun attacking our positions in Syria, especially around Comagene! We need to defend this or we could very well lose!"
 arsacid_event.12.a: "Onwards!"

 arsacid_event.13.t: "Notice to the Satraps"
 arsacid_event.13.d: "The central government announced that it will tighten its grip on our territories."
 arsacid_event.13.a: "Alright."
 arsacid_event.13.b: "What? No!"

 arsacid_event.14.t: "Client King in Armenia?"
 arsacid_event.14.d: "Envoy from the Asracid:\n\"We humbly ask the Princeps of the Romans to recognise our claim on the Armenian throne, and with this the sovereignty of Artabanus II on the throne of the Arsacid Empire.\n\n- xoxo\""
 arsacid_event.14.a: "We'll recognise it."
 arsacid_event.14.b: "Who do you think we are?"

 arsacid_event.15.t: "Establish a Client King in Armenia!"
 arsacid_event.15.d: "Message from the Arsacid:\n\"Hallo! We will annex you and make of your country nothing but a little puppet. Thank you.\n\n- xoxo\""
 arsacid_event.15.a: "Glory to Artaxas III!"
 arsacid_event.15.b: "We will fight!"

 arsacid_event.16.t: "Establish a Client King in Armenia!"
 arsacid_event.16.d: "Message from Armenia:\n\"Hallo. No.\n\n- xoxo\""
 arsacid_event.16.a: "War it is!"
 arsacid_event.16.b: "We'll wait."

 arsacid_event.17.t: "Client King in Armenia?"
 arsacid_event.17.d: "Message from the Romans:\n\"Good day, sir.\nWe won't assist you. Actually, we support the current regime. Let's try another time shall we?\n\n- xoxo\""
 arsacid_event.17.a: "War!"
 arsacid_event.17.b: "Back down."

 arsacid_event.18.t: "Establish a Client King in Armenia!"
 arsacid_event.18.d: "Message from Armenia:\n\"We love our new king, please let us live! We aren't forced to write this under any menace.\n\nWith love,\""
 arsacid_event.18.a: "There's nothing we can do."
 arsacid_event.18.b: "Issue a diplomatic protest!"

 arsacid_event.19.t: "Submit to the Arsacid!"
 arsacid_event.19.d: "An envoy from the newly proclaimed 'Godly Empire' of the Arsacid dynasty has arrived to our capital: they are asking us to submit and convert to their new religion or they will crush us!"
 arsacid_event.19.a: "There's nothing we can do!"
 arsacid_event.19.b: "No?"

 arsacid_event.20.t: "Submit to the Arsacid!"
 arsacid_event.20.d: "An envoy from the newly proclaimed 'Godly Empire' of the Arsacid dynasty has arrived to our capital: they are asking us to submit and convert to their new religion or they will crush us!"
 arsacid_event.20.a: "There's nothing we can do!"
 arsacid_event.20.b: "No?"

 arsacid_event.21.t: "Submit to the Arsacid!"
 arsacid_event.21.d: "An envoy from the newly proclaimed 'Godly Empire' of the Arsacid dynasty has arrived to our capital: they are asking us to submit and convert to their new religion or they will crush us!"
 arsacid_event.21.a: "There's nothing we can do!"
 arsacid_event.21.b: "No?"

 arsacid_event.22.t: "Submit to the Arsacid!"
 arsacid_event.22.d: "An envoy from the newly proclaimed 'Godly Empire' of the Arsacid dynasty has arrived to our capital: they are asking us to submit and convert to their new religion or they will crush us!"
 arsacid_event.22.a: "There's nothing we can do!"
 arsacid_event.22.b: "No?"

 arsacid_event.23.t: "Treaty Port Purchase"
 arsacid_event.23.d: "An envoy from the Arsacid asked us if we would be willing to sell one of our port to them, as a lease. It could be beneficial in the short-term, but might become a problem later."
 arsacid_event.23.a: "Why not!"
 arsacid_event.23.b: "No thanks."

 arsacid_event.24.t: "The Arsacid asks for us to Stop the Raids!"
 arsacid_event.24.d: "The Arsacid are asking us to stop raiding their territories."
 arsacid_event.24.a: "We'll stop. For now."
 arsacid_event.24.b: "We'll do as we please!"

 arsacid_event.25.t: "Answer from [FROM.GetName]"
 arsacid_event.25.d: "They accepted!"
 arsacid_event.25.a: "Finally!"

 arsacid_event.26.t: "Answer from [FROM.GetName]"
 arsacid_event.26.d: "They refused!"
 arsacid_event.26.a: "These idiots!"

 arsacid_event.27.t: "The Arsacid Demands parts of our Territories!"
 arsacid_event.27.d: "The Arsacid are asking for a good part of our eastern territories, arguing that they were once under their control and that we can't protect the trade routes with China."
 arsacid_event.27.a: "There's nothing we can do.."
 arsacid_event.27.b: "Why would we do that?"

 arsacid_event.28.t: "The Arsacid Empire seeks to normalise relations with us!"
 arsacid_event.28.d: "An envoy from the Arsacid Empire has arrived in our capital, asking to normalise relations between our two countries. This could be a good opportunity to finally end the everlasting wars between us and pave the way towards an alliance against our enemies."
 arsacid_event.28.a: "We can't continue waging war!"
 arsacid_event.28.b: "On my dead body!"

 arsacid_event.29.t: "[FROM.GetName] has normalised relations with us!"
 arsacid_event.29.d: "The [FROM.GetAdjective] government has agreed to normalise relations with us. This may be the start of a new alliance!"
 arsacid_event.29.a: "Great!"

 arsacid_event.30.t: "[FROM.GetName] has refused to normalise relations with us!"
 arsacid_event.30.d: "The [FROM.GetAdjective] government has refused to normalise relations with us, therefore declaring its true intentions in the face of our envoys: we must get ready for war, if that's what they want!"
 arsacid_event.30.a: "These nomadic bastards!"

 arsacid_event.31.t: "Arsacid power is growing!"
 arsacid_event.31.d: "The new Arsacid government has decided to overturn the Council and reinforce its power. We must not let it happen!"
 arsacid_event.31.a: "We must act!"

 arsacid_event.32.t: "Ultimatum from the Arsacid Empire"
 arsacid_event.32.d: "The Arsacid authorities are asking us to hand over various states in the East, threatening total war if we do not concede."
 arsacid_event.32.a: "We can't do much now, can we?"
 arsacid_event.32.b: "What a joke!"

 arsacid_event.33.t: "Ultimatum from the Arsacid - Accepted"
 arsacid_event.33.d: ""
 arsacid_event.33.a: "Glory to us, the Masters of the East!"
 arsacid_event.33.b: "Actually.. I have other plans."

 arsacid_event.34.t: "Ultimatum from the Arsacid - To Rome!"
 arsacid_event.34.d: ""
 arsacid_event.34.a: "We'll see you in Rome!"

 arsacid_event.35.t: "Rome asks for Peace!"
 arsacid_event.35.d: "Roman envoys arrived in Ctesiphon today. They are officially asking us to stop our war against Armenia, threatening to intervene on the side of the Armenians to contain our attacks. The Romans states that they will not hesitate to declare war if we do not accept the proposed peace treaty."
 arsacid_event.35.a: "Let's agree to a deal."
 arsacid_event.35.b: "We shall conquer Armenia for us!"

 arsacid_border_conflict.1.t: "Skirmishes in Syria!"
 arsacid_border_conflict.1.d: "The Arsacid won."
 arsacid_border_conflict.1.a: "We won!"
 arsacid_border_conflict.1.b: "A blow for our reputation."

 arsacid_border_conflict.2.t: "Skirmishes in Syria!"
 arsacid_border_conflict.2.d: "The Roman won!"
 arsacid_border_conflict.2.a: "We lost!"
 arsacid_border_conflict.2.b: "Rome wins again!"

 arsacid_border_conflict.3.t: "Skirmishes in Syria!"
 arsacid_border_conflict.3.d: "Nobody won."
 arsacid_border_conflict.3.a: "Middle ground."
 arsacid_border_conflict.3.b: "Middle ground."


