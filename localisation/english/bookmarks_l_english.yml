l_english:
 AUGUSTUSDEATH_NAME: "The Death of Augustus"
 AUGUSTUSDEATH_DESC: "August 14 marks the end of an era for the Roman Empire. The first Emperor, Caesar Augustus, dies. But the death of the roman emperor is not the only thing happening in the world; in China, the Xin dynasty is fighting for its survival, while in the Middle East, the Arsacid are consolidating their power, hoping to get Armenia back under their control. Finally, in the 'Barbaric world', as named by the Romans, various power plays are happening, both in Germania and in southern Britannia, which could decide the continent's fate."

 ROE_AUGUSTUSDEATH_DESC: "In August, 14, the first Emperor of the Romans will die. Leaving a powerful Empire to its heir, Tiberius, it is however still fragile. In the north, the Germans are still raiding territories over the Rhine, while Senators nostalgic of the bygone Republic are willing to restore it, at all costs."
 CRS_AUGUSTUSDEATH_DESC: "Lead by Arminius, an experienced romanised german, Germania got itself a symbol of resistance against Roman imperialism. After the Teutoburg battle, which ended in a victory for the germanic coalition, Arminius might be the one setting a new regional order in central Europe."
 PTH_AUGUSTUSDEATH_DESC: "Following a period of civil troubles, the King of Kings Artabanus II stands strong against its enemies. In the west, the Romans and Armenia, with at its head Vonones I, who was overthrown by Artabanus II a few years back. With that lies the eastern half of the empire, with nomads and the indian kingdoms hoping to destroy our Empire."
 IDS_AUGUSTUSDEATH_DESC: "The eastern administration is dangerously feeble: far away from the central power located in Ctesiphon, the rulers here are growingly powerful, until at some point the balance might shift. When will it be is truly an important question but it is a question that cannot be answered yet."
 XIN_AUGUSTUSDEATH_DESC: "Usurpator of the Han dynasty, the Xin dynasty is one peculiar interregnum in Chinese history. Will you appease the peasants and stabilise your realm, in an attempt to solidify the dynasty, or will you try to reclaim the throne for the Han, and restore the Imperial Might?"
 XAI_AUGUSTUSDEATH_DESC: "Nomads of the northern steppes, the Xiongnu are at a doorstep in their history. With tensions between them and China for now over decades, the new Chanyu is expected to find an issue to this conflict, through force or diplomacy."

 OTHER_BLITZKRIEG_DESC: ""

