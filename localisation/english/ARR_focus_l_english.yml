l_english:
 armenia_rules:0 "Armenia Rules"
 armenia_rules_desc:0 "Armenia sits at a crossroads, on one side, the Romans, powerful and vengeful, and on the other, the Parthians, under the Arsacid dynasty, preying on our beautiful Armenia and its king, Vonones."
 armenia_crumbles:0 "Armenia Crumbles"
 armenia_crumbles_desc:0 "Our King is imprisoned in Syria, our country is on the verge of war with Parthia, the Romans are no longer our friends. Who are we now, only a shell of our former selves? What shall it becomes of Armenia?"
